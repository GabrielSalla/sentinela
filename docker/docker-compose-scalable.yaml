services:
  postgres:
    image: postgres:16.4-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=postgres

  floci:
    image: floci/floci:latest-compat
    ports:
      - 4566:4566
    environment:
      FLOCI_HOSTNAME: floci
    healthcheck:
      test: curl --fail localhost:4566/_localstack/health || exit 1
      interval: 1s
      timeout: 1s
      retries: 5
      start_period: 1s

  sentinela-controller:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sentinela
      args:
        CONFIGS_FILE: configs/configs-scalable.yaml
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 100M
    image: sentinela-scalable:latest
    ports:
      - 8000:8000
    healthcheck:
      test: health_check 8000
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 2s
    env_file:
      - .env.general
      - .env.secrets
    depends_on:
      - postgres
      - floci
    command: sentinela run controller

  sentinela-executor:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sentinela
      args:
        CONFIGS_FILE: configs/configs-scalable.yaml
    image: sentinela-scalable:latest
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: 1
          memory: 128M
    ports:
      - 8001-8100:8000
    healthcheck:
      test: health_check 8000
      interval: 10s
      timeout: 1s
      retries: 3
      start_period: 2s
    env_file:
      - .env.general
      - .env.secrets
    depends_on:
      - postgres
      - floci
    command: sentinela run executor
