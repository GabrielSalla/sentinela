<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - Sentinela</title>
    <link rel="stylesheet" href="/dashboard/css/styles.css">
</head>
<body onload="checkInviteToken()">
    <div class="login-container">
        <h1>Set Password</h1>
        <p>Password must:</p>
        <ul>
            <li>be at least 12 characters long</li>
            <li>contain an uppercase letter</li>
            <li>contain a lowercase letter</li>
            <li>contain a digit</li>
            <li>contain a special character</li>
        </ul>
        <form id="set-password-form" onsubmit="return setPassword(event)">
            <div class="form-group">
                <label for="password">New password:</label>
                <input type="password" id="password" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm password:</label>
                <input type="password" id="confirm-password" autocomplete="new-password" required>
            </div>
            <div id="set-password-error" class="error-message"></div>
            <div id="set-password-success" class="success-message"></div>
            <button type="submit" class="btn">Set Password</button>
        </form>
    </div>
    <script src="/dashboard/js/auth.js"></script>
</body>
</html>
